name: Build & Release APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

env:
  KS_PASS: minilauncher
  KS_ALIAS: minilauncher

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # Dibuat otomatis sekali saja, lalu disimpan di repo supaya
      # semua rilis berikutnya memakai tanda tangan yang sama.
      - name: Ensure signing keystore
        run: |
          if [ ! -f keystore/release.jks ]; then
            mkdir -p keystore
            keytool -genkeypair -keystore keystore/release.jks \
              -alias "$KS_ALIAS" -storepass "$KS_PASS" -keypass "$KS_PASS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=MiniLauncher"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add keystore/release.jks
            git commit -m "Add signing keystore [skip ci]"
            git push
          fi

      - name: Build signed APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/keystore/release.jks
          KEYSTORE_PASSWORD: ${{ env.KS_PASS }}
          KEY_ALIAS: ${{ env.KS_ALIAS }}
          KEY_PASSWORD: ${{ env.KS_PASS }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: gradle assembleRelease --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "MiniLauncher-v1.0.${{ github.run_number }}.apk"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: MiniLauncher v1.0.${{ github.run_number }}
          files: MiniLauncher-v1.0.${{ github.run_number }}.apk
          generate_release_notes: true
